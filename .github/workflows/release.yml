name: Release Extension & Userscript

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Userscript and Run Tests
        run: |
          node build_userscript.js
          node build_testbed.js
          node test/run_all.js

      - name: Create Chrome Extension ZIP
        run: |
          cd chrome-extension
          zip -r ../ScalerLiveClassEncryptedChat-ChromeExtension.zip . -x "*.DS_Store" "*.git*"
          cd ..

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Scaler Encrypted Chat ${{ github.ref_name }}
          files: |
            ScalerLiveClassEncryptedChat-ChromeExtension.zip
            scaler-encrypted-chat.user.js
          generate_release_notes: true
          draft: false
          prerelease: false
